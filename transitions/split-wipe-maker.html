<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Wipe Transition Maker</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        :root { --bg: #0d1412; --panel: #17231f; --border: #2f4840; --text: #ecfdf5; --muted: #9bc8b8; --accent: #059669; --success: #f59e0b; }
        * { box-sizing: border-box; }
        body { margin: 0; height: 100vh; display: grid; grid-template-columns: 280px 1fr; overflow: hidden; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; }
        .sidebar { background: var(--panel); border-right: 1px solid var(--border); padding: 18px; overflow-y: auto; }
        h2 { margin: 0 0 18px; font-size: 1.1rem; }
        .group { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; }
        label { display: block; margin: 12px 0 6px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }
        input, select, button { width: 100%; font: inherit; }
        input, select { color: var(--text); background: #101917; border: 1px solid var(--border); border-radius: 6px; padding: 9px 10px; }
        button { border: none; border-radius: 6px; padding: 10px 12px; cursor: pointer; font-weight: 800; }
        .run { background: var(--accent); color: white; }
        #downloadBtn { background: var(--success); color: #231505; margin-top: 10px; }
        .preview { position: relative; overflow: hidden; background: radial-gradient(circle at 50% 50%, rgba(5, 150, 105, 0.18), transparent 42%), #030807; display: grid; place-items: center; }
        .stage { position: relative; width: min(74vw, 960px); aspect-ratio: 16 / 9; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #111827; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42); }
        .slide { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(1.4rem, 4vw, 3.4rem); font-weight: 900; letter-spacing: 0; }
        .from { background: radial-gradient(circle at 20% 25%, rgba(245, 158, 11, 0.45), transparent 30%), linear-gradient(135deg, #431407, #111827); }
        .to { background: radial-gradient(circle at 75% 35%, rgba(52, 211, 153, 0.46), transparent 30%), linear-gradient(135deg, #064e3b, #0f172a); clip-path: polygon(50% 0, 50% 0, 50% 100%, 50% 100%); }
        .stage.is-playing .to { animation: split-vertical var(--duration, 1s) var(--ease, ease-in-out) forwards; }
        .stage.is-playing[data-axis="horizontal"] .to { animation-name: split-horizontal; }
        @keyframes split-vertical {
            from { clip-path: polygon(50% 0, 50% 0, 50% 100%, 50% 100%); filter: blur(var(--gap-blur, 8px)); }
            to { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); filter: blur(0); }
        }
        @keyframes split-horizontal {
            from { clip-path: polygon(0 50%, 100% 50%, 100% 50%, 0 50%); filter: blur(var(--gap-blur, 8px)); }
            to { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); filter: blur(0); }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <h2>Split Wipe Maker</h2>
        <div class="group"><button id="runBtn" class="run">Play Transition</button></div>
        <div class="group">
            <label>Duration <span id="val-duration"></span></label>
            <input type="range" id="duration" min="0.2" max="5" step="0.1" value="1">
            <label>Axis</label>
            <select id="axis">
                <option value="vertical">Vertical Split</option>
                <option value="horizontal">Horizontal Split</option>
            </select>
            <label>Gap Blur <span id="val-gapBlur"></span></label>
            <input type="range" id="gapBlur" min="0" max="24" step="1" value="8">
            <label>Easing</label>
            <select id="easing">
                <option value="ease-in-out">Ease In Out</option>
                <option value="ease">Ease</option>
                <option value="ease-out">Ease Out</option>
                <option value="linear">Linear</option>
            </select>
        </div>
        <div class="group">
            <label>Transition Name</label>
            <input type="text" id="transitionName" value="Split Wipe Transition">
            <button id="downloadBtn">Use Transition</button>
        </div>
    </aside>
    <main class="preview">
        <div class="stage" id="stage" data-axis="vertical">
            <div class="slide from">Outgoing Slide</div>
            <div class="slide to">Incoming Slide</div>
        </div>
    </main>
    <script>
        const ENGINE = 'split-wipe';
        const MAKER = 'transitions/split-wipe-maker.html';
        const cfg = { duration: 1, axis: 'vertical', mode: 'open', gapBlur: 8, easing: 'ease-in-out' };
        const stage = document.getElementById('stage');

        function applyValues() {
            cfg.duration = Number(document.getElementById('duration').value) || 1;
            cfg.axis = document.getElementById('axis').value;
            cfg.gapBlur = Number(document.getElementById('gapBlur').value) || 0;
            cfg.easing = document.getElementById('easing').value;
            document.getElementById('val-duration').textContent = `${cfg.duration.toFixed(1)}s`;
            document.getElementById('val-gapBlur').textContent = `${cfg.gapBlur}px`;
            stage.dataset.axis = cfg.axis;
            stage.style.setProperty('--duration', `${cfg.duration}s`);
            stage.style.setProperty('--gap-blur', `${cfg.gapBlur}px`);
            stage.style.setProperty('--ease', cfg.easing);
        }

        function runPreview() {
            applyValues();
            stage.classList.remove('is-playing');
            void stage.offsetWidth;
            stage.classList.add('is-playing');
        }

        function getExportJSON() {
            applyValues();
            return { version: 1, name: document.getElementById('transitionName').value.trim() || 'Split Wipe Transition', engine: ENGINE, maker: MAKER, config: { ...cfg } };
        }

        function loadEditConfig(config) {
            if (!config || typeof config !== 'object') return;
            if (config.duration != null) document.getElementById('duration').value = config.duration;
            if (config.axis) document.getElementById('axis').value = config.axis;
            if (config.gapBlur != null) document.getElementById('gapBlur').value = config.gapBlur;
            if (config.easing) document.getElementById('easing').value = config.easing;
            applyValues();
        }

        document.getElementById('runBtn').addEventListener('click', runPreview);
        ['duration', 'axis', 'gapBlur', 'easing'].forEach(id => document.getElementById(id).addEventListener('input', runPreview));
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const payload = getExportJSON();
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(payload, '*');
            } else {
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'split-wipe-transition.json';
                a.click();
            }
        });
        window.addEventListener('message', event => { if (event.data === 'trigger_apply') document.getElementById('downloadBtn').click(); });
        const storedJson = sessionStorage.getItem('transitionEditData');
        if (storedJson) {
            try {
                const transitionData = JSON.parse(storedJson);
                if (transitionData.name) document.getElementById('transitionName').value = transitionData.name;
                loadEditConfig(transitionData.config);
            } catch (error) {}
        }
        applyValues();
        runPreview();
    </script>
</body>

</html>
