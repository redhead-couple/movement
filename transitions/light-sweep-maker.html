<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Sweep Transition Maker</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        :root { --bg: #10130f; --panel: #202418; --border: #465033; --text: #fbffe9; --muted: #c6d29a; --accent: #eab308; --success: #22c55e; }
        * { box-sizing: border-box; }
        body { margin: 0; height: 100vh; display: grid; grid-template-columns: 280px 1fr; overflow: hidden; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; }
        .sidebar { background: var(--panel); border-right: 1px solid var(--border); padding: 18px; overflow-y: auto; }
        h2 { margin: 0 0 18px; font-size: 1.1rem; }
        .group { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; }
        label { display: block; margin: 12px 0 6px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }
        input, select, button { width: 100%; font: inherit; }
        input, select { color: var(--text); background: #15190f; border: 1px solid var(--border); border-radius: 6px; padding: 9px 10px; }
        button { border: none; border-radius: 6px; padding: 10px 12px; cursor: pointer; font-weight: 800; }
        .run { background: var(--accent); color: #1c1604; }
        #downloadBtn { background: var(--success); color: #05200e; margin-top: 10px; }
        .preview { position: relative; overflow: hidden; background: radial-gradient(circle at 50% 45%, rgba(234, 179, 8, 0.16), transparent 42%), #070805; display: grid; place-items: center; }
        .stage { position: relative; width: min(74vw, 960px); aspect-ratio: 16 / 9; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #111827; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42); }
        .slide { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(1.4rem, 4vw, 3.4rem); font-weight: 900; letter-spacing: 0; }
        .from { background: radial-gradient(circle at 20% 25%, rgba(14, 165, 233, 0.42), transparent 30%), linear-gradient(135deg, #172554, #111827); }
        .to { background: radial-gradient(circle at 78% 35%, rgba(250, 204, 21, 0.46), transparent 30%), linear-gradient(135deg, #365314, #713f12); clip-path: inset(0 100% 0 0); filter: blur(var(--blur, 8px)); }
        .band { position: absolute; inset: 0; z-index: 4; pointer-events: none; mix-blend-mode: screen; opacity: calc(.35 + var(--intensity, .75) * .65); background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0) 38%, rgba(255,246,188,.55) 48%, rgba(255,255,255,.95) 54%, rgba(150,220,255,.5) 62%, rgba(255,255,255,0) 72%, transparent 100%); filter: blur(calc(var(--blur, 8px) * .5)); transform: translateX(-122%); }
        .stage.is-playing .to { animation: reveal-left var(--duration, 1.1s) var(--ease, ease-in-out) forwards; }
        .stage.is-playing .band { animation: sweep-left var(--duration, 1.1s) var(--ease, ease-in-out) forwards; }
        .stage.is-playing[data-direction="right"] .to { animation-name: reveal-right; }
        .stage.is-playing[data-direction="right"] .band { animation-name: sweep-right; }
        .stage.is-playing[data-direction="up"] .to { animation-name: reveal-up; }
        .stage.is-playing[data-direction="up"] .band { animation-name: sweep-up; background: linear-gradient(0deg, transparent 0%, rgba(255,255,255,0) 38%, rgba(255,246,188,.55) 48%, rgba(255,255,255,.95) 54%, rgba(150,220,255,.5) 62%, rgba(255,255,255,0) 72%, transparent 100%); }
        .stage.is-playing[data-direction="down"] .to { animation-name: reveal-down; }
        .stage.is-playing[data-direction="down"] .band { animation-name: sweep-down; background: linear-gradient(0deg, transparent 0%, rgba(255,255,255,0) 38%, rgba(255,246,188,.55) 48%, rgba(255,255,255,.95) 54%, rgba(150,220,255,.5) 62%, rgba(255,255,255,0) 72%, transparent 100%); }
        @keyframes reveal-left { from { clip-path: inset(0 100% 0 0); filter: blur(var(--blur, 8px)); } to { clip-path: inset(0 0 0 0); filter: blur(0); } }
        @keyframes reveal-right { from { clip-path: inset(0 0 0 100%); filter: blur(var(--blur, 8px)); } to { clip-path: inset(0 0 0 0); filter: blur(0); } }
        @keyframes reveal-up { from { clip-path: inset(100% 0 0 0); filter: blur(var(--blur, 8px)); } to { clip-path: inset(0 0 0 0); filter: blur(0); } }
        @keyframes reveal-down { from { clip-path: inset(0 0 100% 0); filter: blur(var(--blur, 8px)); } to { clip-path: inset(0 0 0 0); filter: blur(0); } }
        @keyframes sweep-left { from { transform: translateX(-122%); opacity: 1; } to { transform: translateX(122%); opacity: 0; } }
        @keyframes sweep-right { from { transform: translateX(122%); opacity: 1; } to { transform: translateX(-122%); opacity: 0; } }
        @keyframes sweep-up { from { transform: translateY(122%); opacity: 1; } to { transform: translateY(-122%); opacity: 0; } }
        @keyframes sweep-down { from { transform: translateY(-122%); opacity: 1; } to { transform: translateY(122%); opacity: 0; } }
    </style>
</head>

<body>
    <aside class="sidebar">
        <h2>Light Sweep Maker</h2>
        <div class="group"><button id="runBtn" class="run">Play Transition</button></div>
        <div class="group">
            <label>Duration <span id="val-duration"></span></label>
            <input type="range" id="duration" min="0.2" max="5" step="0.1" value="1.1">
            <label>Direction</label>
            <select id="direction">
                <option value="left">Left</option>
                <option value="right">Right</option>
                <option value="up">Up</option>
                <option value="down">Down</option>
            </select>
            <label>Band Width <span id="val-bandWidth"></span></label>
            <input type="range" id="bandWidth" min="6" max="60" step="1" value="22">
            <label>Brightness <span id="val-intensity"></span></label>
            <input type="range" id="intensity" min="0" max="1" step="0.05" value="0.75">
            <label>Blur <span id="val-blur"></span></label>
            <input type="range" id="blur" min="0" max="24" step="1" value="8">
            <label>Easing</label>
            <select id="easing">
                <option value="ease-in-out">Ease In Out</option>
                <option value="ease">Ease</option>
                <option value="ease-out">Ease Out</option>
                <option value="linear">Linear</option>
            </select>
        </div>
        <div class="group">
            <label>Transition Name</label>
            <input type="text" id="transitionName" value="Light Sweep Transition">
            <button id="downloadBtn">Use Transition</button>
        </div>
    </aside>
    <main class="preview">
        <div class="stage" id="stage" data-direction="left">
            <div class="slide from">Outgoing Slide</div>
            <div class="slide to">Incoming Slide</div>
            <div class="band" aria-hidden="true"></div>
        </div>
    </main>
    <script>
        const ENGINE = 'light-sweep';
        const MAKER = 'transitions/light-sweep-maker.html';
        const cfg = { duration: 1.1, direction: 'left', bandWidth: 22, intensity: 0.75, blur: 8, easing: 'ease-in-out' };
        const stage = document.getElementById('stage');
        const band = stage.querySelector('.band');

        function bandGradient(direction, bandWidth, intensity) {
            const half = Math.max(2, Math.min(40, bandWidth / 2));
            const edgeA = Math.max(0, 50 - half);
            const glowA = Math.max(edgeA, 50 - (half * 0.35));
            const glowB = Math.min(100, 50 + (half * 0.35));
            const edgeB = Math.min(100, 50 + half);
            const warm = (0.34 + intensity * 0.38).toFixed(2);
            const core = (0.62 + intensity * 0.35).toFixed(2);
            const cool = (0.24 + intensity * 0.28).toFixed(2);
            const angle = (direction === 'up' || direction === 'down') ? '0deg' : '90deg';
            return `linear-gradient(${angle}, transparent 0%, rgba(255,255,255,0) ${edgeA}%, rgba(255,246,188,${warm}) ${glowA}%, rgba(255,255,255,${core}) 50%, rgba(150,220,255,${cool}) ${glowB}%, rgba(255,255,255,0) ${edgeB}%, transparent 100%)`;
        }

        function applyValues() {
            cfg.duration = Number(document.getElementById('duration').value) || 1.1;
            cfg.direction = document.getElementById('direction').value;
            cfg.bandWidth = Number(document.getElementById('bandWidth').value) || 22;
            cfg.intensity = Number(document.getElementById('intensity').value) || 0;
            cfg.blur = Number(document.getElementById('blur').value) || 0;
            cfg.easing = document.getElementById('easing').value;
            document.getElementById('val-duration').textContent = `${cfg.duration.toFixed(1)}s`;
            document.getElementById('val-bandWidth').textContent = `${cfg.bandWidth}%`;
            document.getElementById('val-intensity').textContent = `${Math.round(cfg.intensity * 100)}%`;
            document.getElementById('val-blur').textContent = `${cfg.blur}px`;
            stage.dataset.direction = cfg.direction;
            stage.style.setProperty('--duration', `${cfg.duration}s`);
            stage.style.setProperty('--intensity', cfg.intensity);
            stage.style.setProperty('--blur', `${cfg.blur}px`);
            stage.style.setProperty('--ease', cfg.easing);
            band.style.background = bandGradient(cfg.direction, cfg.bandWidth, cfg.intensity);
        }

        function runPreview() {
            applyValues();
            stage.classList.remove('is-playing');
            void stage.offsetWidth;
            stage.classList.add('is-playing');
        }

        function getExportJSON() {
            applyValues();
            return { version: 1, name: document.getElementById('transitionName').value.trim() || 'Light Sweep Transition', engine: ENGINE, maker: MAKER, config: { ...cfg } };
        }

        function loadEditConfig(config) {
            if (!config || typeof config !== 'object') return;
            if (config.duration != null) document.getElementById('duration').value = config.duration;
            if (config.direction) document.getElementById('direction').value = config.direction;
            if (config.bandWidth != null) document.getElementById('bandWidth').value = config.bandWidth;
            if (config.intensity != null) document.getElementById('intensity').value = config.intensity;
            if (config.blur != null) document.getElementById('blur').value = config.blur;
            if (config.easing) document.getElementById('easing').value = config.easing;
            applyValues();
        }

        document.getElementById('runBtn').addEventListener('click', runPreview);
        ['duration', 'direction', 'bandWidth', 'intensity', 'blur', 'easing'].forEach(id => document.getElementById(id).addEventListener('input', runPreview));
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const payload = getExportJSON();
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(payload, '*');
            } else {
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'light-sweep-transition.json';
                a.click();
            }
        });
        window.addEventListener('message', event => { if (event.data === 'trigger_apply') document.getElementById('downloadBtn').click(); });
        const storedJson = sessionStorage.getItem('transitionEditData');
        if (storedJson) {
            try {
                const transitionData = JSON.parse(storedJson);
                if (transitionData.name) document.getElementById('transitionName').value = transitionData.name;
                loadEditConfig(transitionData.config);
            } catch (error) {}
        }
        applyValues();
        runPreview();
    </script>
</body>

</html>
