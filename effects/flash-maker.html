<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <base href="../">
    <title>Flash/Realization Generator</title>
<meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="studio/maker/maker-theme.css">
</head>

<body>

    <div class="sidebar">
        <h2 style="margin-top:0">Flash Studio</h2>

        <div class="group">
            <h4>1. Image</h4>

            <div style="display: flex; gap: 8px; align-items: center; justify-content: space-between;">
                <input type="file" id="imgInput" accept="image/*" style="width: 150px;">
                <button class="small" onclick="window.openMediaLibrary('img')" style="margin: 0;">Browse Lib</button>
            </div>
            <div id="overrideContainer"></div>

        </div>

        <div class="group">
            <button class="run" id="runBtn">⚡ TRIGGER FLASH</button>
        </div>

        <div class="group">
            <h4>2. The Burst</h4>
            <label>Intensity (Brightness) <span id="val-intensity"></span></label>
            <input type="range" id="intensity" min="0.5" max="5.0" step="0.1" value="2.0">

            <label>Attack Speed (How fast) <span id="val-speed"></span></label>
            <input type="range" id="speed" min="1" max="20" value="10">

            <label>Hold Duration (Frames) <span id="val-hold"></span></label>
            <input type="range" id="hold" min="0" max="60" value="0">

            <label>Decay (Fade out) <span id="val-decay"></span></label>
            <div style="font-size:0.75rem;color:#64748b;margin-bottom:4px;">Lower = Faster fade out</div>
            <input type="range" id="decay" min="0.80" max="0.99" step="0.01" value="0.95">
        </div>

        <div class="group">
            <h4>3. Style</h4>
            <label>Tint Color</label>
            <input type="color" id="tint" value="#ffffff">

            <label>Glow (Bloom Radius) <span id="val-bloom"></span></label>
            <input type="range" id="bloom" min="0" max="100" value="20">
        </div>

        <div class="group">
            <h4>4. Export</h4>
            <input type="text" id="filename" value="flash-realization.json">
            <button id="downloadBtn">Download Effect</button>
        </div>
    </div>

    <div class="preview" id="stage">
        <canvas id="cvs"></canvas>
    </div>


    <script type="module">
        function effectCodeToDefinition(code, engine) {
            const match = code.match(/return\s+\w+\s*\(\s*canvas\s*,\s*ctx\s*,\s*(\{[\s\S]*?\})\s*\)\s*;/);
            if (!match) throw new Error("Could not parse generated effect code");
            const objExpr = match[1].replace(/^\s*\.\.\.config\s*,?\s*/m, "");
            const config = (new Function("return (" + objExpr + ");"))();
            return { engine, config };
        }

        const ENGINE_PATH = '/effects/flash-engine.js';
        const ENGINE = 'flash';
        import { mount } from '/effects/flash-engine.js';

        const canvas = document.getElementById('cvs');
        const ctx = canvas.getContext('2d');
        let cleanup = null;

        const cfg = {
            intensity: 2.0, speed: 10, hold: 0, decay: 0.95,
            tint: '#ffffff', bloom: 20
        };

        window.run = run;
        function run() {
            if (cleanup) cleanup();
            Object.keys(cfg).forEach(k => {
                const el = document.getElementById('val-' + k);
                if (el) el.textContent = cfg[k];
            });
            // We force triggerAtStart: true for preview so you see it immediately
            cleanup = mount(canvas, ctx, { ...cfg, imgSrc: window.imgData, triggerAtStart: true });
        }

        // Image preloading and upload wiring are handled centrally by maker-engine.js.
        ['intensity', 'speed', 'hold', 'decay', 'bloom'].forEach((id) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('input', (e) => {
                cfg[id] = parseFloat(e.target.value);
                run();
            });
        });

        document.getElementById('tint').addEventListener('input', (e) => {
            cfg.tint = e.target.value;
            run();
        });

        document.getElementById('runBtn').addEventListener('click', run);

        run();
        window.MakerAPI = {
            onImageLoaded: () => { if(typeof run === 'function') { run(); } else { window.runPreview && window.runPreview(); }},
            run: () => { if(typeof run === 'function') { run(); } else { window.runPreview && window.runPreview(); } },
            getExportJSON: () => {
                const code = `
import { mount as runFlash } from '${ENGINE_PATH}';
export function mount(canvas, ctx, config) {
    return runFlash(canvas, ctx, {
        ...config,
        imgSrc: 'img/${window.imgName}',
        intensity: ${cfg.intensity}, speed: ${cfg.speed},
        hold: ${cfg.hold}, decay: ${cfg.decay},
        tint: '${cfg.tint}', bloom: ${cfg.bloom},
        triggerAtStart: true
    });
}`;
                const match = code.match(/return\s+\w+\s*\(\s*canvas\s*,\s*ctx\s*,\s*(\{[\s\S]*?\})\s*\)\s*;/);
                const objExpr = match[1].replace(/^\s*\.\.\.config\s*,?\s*/m, "");
                const configObj = (new Function("return (" + objExpr + ");"))();
                return { engine: ENGINE, config: configObj };
            }
        };
    </script>
    <!-- GLOBAL MAKER ENGINE -->
    <script src="studio/maker/maker-engine.js"></script>
</body>
</html>
