<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <base href="../">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scattered Idea Maker</title>
    <link rel="stylesheet" href="studio/maker/maker-theme.css">
    <style>
        .preview-note {
            position: absolute;
            right: 18px;
            bottom: 16px;
            padding: 7px 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.78);
            color: #cbd5e1;
            font-size: 0.75rem;
            pointer-events: none;
        }

        details.group summary {
            cursor: pointer;
            color: #e2e8f0;
            font-weight: 700;
            padding: 2px 0 8px;
        }

        .control-value {
            float: right;
            color: #93c5fd;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h2 style="margin-top:0">Scattered Idea</h2>

        <div class="group">
            <h4>Slide image</h4>
            <div style="display:flex; gap:8px; align-items:center; justify-content:space-between;">
                <input type="file" id="imgInput" accept="image/*" style="width:150px;">
                <button class="small" type="button" onclick="window.openMediaLibrary('img')">Browse Library</button>
            </div>
            <div id="overrideContainer"></div>
        </div>

        <div class="group">
            <button id="runBtn" class="run" type="button">Play from beginning</button>
        </div>

        <div class="group">
            <h4>Breakup</h4>
            <label for="count">Amount <span class="control-value" id="val-count">63 pieces</span></label>
            <input type="range" id="count" min="12" max="120" step="1" value="63">

            <label for="spread">Spread <span class="control-value" id="val-spread">100%</span></label>
            <input type="range" id="spread" min="40" max="180" step="5" value="100">

            <label for="duration">Duration <span class="control-value" id="val-duration">3.2 s</span></label>
            <input type="range" id="duration" min="1" max="8" step="0.1" value="3.2">
        </div>

        <details class="group" id="advancedControls">
            <summary>Advanced</summary>
            <label for="randomness">Randomness <span class="control-value" id="val-randomness">60%</span></label>
            <input type="range" id="randomness" min="0" max="100" step="5" value="60">

            <label for="startDelay">Start time <span class="control-value" id="val-startDelay">0.8 s</span></label>
            <input type="range" id="startDelay" min="0" max="5" step="0.1" value="0.8">
        </details>

        <div class="group">
            <h4>Export</h4>
            <input type="text" id="filename" value="scattered-idea.json">
            <button id="downloadBtn" type="button">Download Effect</button>
        </div>
    </div>

    <div class="preview" id="stage">
        <canvas id="cvs"></canvas>
        <div class="preview-note">The image clears after the fragments leave.</div>
    </div>

    <script type="module">
        import { DEFAULTS, mount, normalizeConfig } from '/effects/scattered-idea-engine.js';

        const ENGINE = 'scattered-idea';
        const PREVIEW_DEBOUNCE_MS = 140;
        const canvas = document.getElementById('cvs');
        const ctx = canvas.getContext('2d');
        const cfg = {
            count: DEFAULTS.count,
            spread: DEFAULTS.spread,
            duration: DEFAULTS.duration,
            randomness: DEFAULTS.randomness,
            startDelay: DEFAULTS.startDelay
        };
        const units = {
            count: ' pieces',
            spread: '%',
            duration: ' s',
            randomness: '%',
            startDelay: ' s'
        };
        let controller = null;
        let previewTimer = null;
        let previewRequest = 0;
        let savedImageRef = '';

        function currentPreviewSource() {
            return window.img1Data || window.imgData || savedImageRef || '';
        }

        function projectImageRef(value) {
            const source = String(value || '').trim();
            if (!source || /^(?:data:|blob:|[a-z][a-z0-9+.-]*:|\/\/|\/)/i.test(source)) return '';
            if (source.startsWith('img/')) return source;
            const filename = source.split(/[\\/]/).pop();
            return filename ? `img/${filename}` : '';
        }

        function previewConfig() {
            return { ...cfg, imgSrc: currentPreviewSource() };
        }

        function updateValueLabel(key) {
            const target = document.getElementById('val-' + key);
            if (target) target.textContent = `${cfg[key]}${units[key]}`;
        }

        function restartPreview() {
            previewRequest += 1;
            if (previewTimer !== null) {
                clearTimeout(previewTimer);
                previewTimer = null;
            }
            if (!controller) {
                controller = mount(canvas, ctx, previewConfig());
            } else if (typeof controller.restart === 'function') {
                controller.restart(previewConfig());
            }
        }

        function schedulePreview() {
            const request = ++previewRequest;
            if (previewTimer !== null) clearTimeout(previewTimer);
            previewTimer = setTimeout(() => {
                previewTimer = null;
                if (request !== previewRequest) return;
                restartPreview();
            }, PREVIEW_DEBOUNCE_MS);
        }

        function setControlValue(key, value) {
            const normalized = normalizeConfig({ ...cfg, [key]: value });
            cfg[key] = normalized[key];
            const input = document.getElementById(key);
            if (input) input.value = String(cfg[key]);
            updateValueLabel(key);
        }

        ['count', 'spread', 'duration', 'randomness', 'startDelay'].forEach((key) => {
            const input = document.getElementById(key);
            input.addEventListener('input', (event) => {
                setControlValue(key, event.target.value);
                schedulePreview();
            });
        });

        document.getElementById('runBtn').addEventListener('click', restartPreview);

        function loadEditConfig(config) {
            if (!config || typeof config !== 'object') return;
            const normalized = normalizeConfig(config);
            ['count', 'spread', 'duration', 'randomness', 'startDelay'].forEach((key) => {
                setControlValue(key, normalized[key]);
            });
            savedImageRef = projectImageRef(config.imgSrc);
            restartPreview();
        }

        function getExportJSON() {
            const imageNameRef = window.imgName
                ? projectImageRef(`img/${String(window.imgName).split(/[\\/]/).pop()}`)
                : '';
            return {
                enabled: true,
                name: 'Scattered Idea',
                engine: ENGINE,
                maker: 'effects/scattered-idea-maker.html',
                config: {
                    imgSrc: imageNameRef || savedImageRef,
                    count: cfg.count,
                    spread: cfg.spread,
                    duration: cfg.duration,
                    randomness: cfg.randomness,
                    startDelay: cfg.startDelay
                }
            };
        }

        window.MakerAPI = {
            onImageLoaded: restartPreview,
            run: restartPreview,
            getExportJSON,
            loadEditConfig
        };
        window.run = restartPreview;

        function disposePreview() {
            previewRequest += 1;
            if (previewTimer !== null) clearTimeout(previewTimer);
            previewTimer = null;
            if (controller) controller();
            controller = null;
        }

        window.addEventListener('pagehide', disposePreview, { once: true });
        Object.keys(cfg).forEach(updateValueLabel);
        restartPreview();
    </script>
    <script src="studio/maker/maker-engine.js"></script>
</body>

</html>
