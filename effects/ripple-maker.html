<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <base href="../">
    <title>Ripple Generator v4 (Pro)</title>
<meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="studio/maker/maker-theme.css">
</head>

<body>

    <div class="sidebar">
        <h2 style="margin-top:0">Ripple Designer</h2>

        <div class="group">
            <h4>1. Target Image</h4>

            <div style="display: flex; gap: 8px; align-items: center; justify-content: space-between;">
                <input type="file" id="imgInput" accept="image/*" style="width: 150px;">
                <button class="small" onclick="window.openMediaLibrary('img')" style="margin: 0;">Browse Lib</button>
            </div>
            <div id="overrideContainer"></div>

            <div style="font-size:0.75rem; color:#64748b; margin-top:6px; line-height: 1.3;">
                Pick a file from your computer to test.<br>
                * Ensure this file exists in your project's <b>img/</b> folder.
            </div>
        </div>

        <div class="group">
            <h4>2. Animation Controls</h4>
            <button class="play" id="previewBtn">▶ Run Preview</button>
        </div>

        <div class="group">
            <h4>3. Timing & Count</h4>

            <div class="param-row">
                <label>Start X</label>
                <input type="number" id="n-x" class="num-input" step="0.01" value="0.5">
            </div>
            <div class="param-row">
                <label>Start Y</label>
                <input type="number" id="n-y" class="num-input" step="0.01" value="0.5">
            </div>
            <div style="font-size:0.7rem; color:#64748b; margin-bottom:8px;">(Or click image to set position)</div>

            <div class="param-row">
                <label>Start Delay (ms)</label>
                <input type="number" id="n-start" class="num-input" step="100" value="0">
            </div>
            <input type="range" id="start" min="0" max="5000" step="100" value="0">

            <div class="param-row">
                <label>Count (-1 = Infinite)</label>
                <input type="number" id="count" class="num-input" value="1" style="width:100%">
            </div>
            <div style="margin-bottom:10px"></div>

            <div class="param-row">
                <label>Interval (ms)</label>
                <input type="number" id="n-interval" class="num-input" step="50" value="800">
            </div>
            <input type="range" id="interval" min="100" max="3000" step="50" value="800">
        </div>

        <div class="group">
            <h4>4. Physics</h4>

            <div class="param-row">
                <label>Frequency (Thickness)</label>
                <input type="number" id="n-freq" class="num-input" step="0.001" value="0.02">
            </div>
            <input type="range" id="freq" min="0.005" max="0.1" step="0.001" value="0.02">

            <div class="param-row">
                <label>Speed (Expansion)</label>
                <input type="number" id="n-speed" class="num-input" step="1" value="15">
            </div>
            <input type="range" id="speed" min="5" max="50" value="15">

            <div class="param-row">
                <label>Strength (Amp)</label>
                <input type="number" id="n-amp" class="num-input" step="1" value="20">
            </div>
            <input type="range" id="amp" min="1" max="100" value="20">

            <div class="param-row">
                <label>Fade Out (Decay)</label>
                <input type="number" id="n-decay" class="num-input" step="0.001" value="0.03">
            </div>
            <input type="range" id="decay" min="0.001" max="0.1" step="0.001" value="0.03">
        </div>

        <div class="group">
            <h4>5. Export</h4>
            <label>Filename</label>
            <input type="text" id="filename" value="my-ripple.json">
            <button id="downloadBtn">Download Effect File</button>
        </div>
    </div>

    <div class="preview" id="stage">
        <div id="marker"></div>
        <canvas id="cvs"></canvas>
    </div>


    <script type="module">
        function effectCodeToDefinition(code, engine) {
            const match = code.match(/return\s+\w+\s*\(\s*canvas\s*,\s*ctx\s*,\s*(\{[\s\S]*?\})\s*\)\s*;/);
            if (!match) throw new Error("Could not parse generated effect code");
            const objExpr = match[1].replace(/^\s*\.\.\.config\s*,?\s*/m, "");
            const config = (new Function("return (" + objExpr + ");"))();
            return { engine, config };
        }

        const ENGINE_PATH = '/effects/ripple-engine.js';
        const ENGINE = 'ripple';
        import { runRipple } from '/effects/ripple-engine.js';

        const canvas = document.getElementById('cvs');
        const ctx = canvas.getContext('2d');
        const marker = document.getElementById('marker');
        let cleanupFunc = null;

        // Default Config
        const config = {
            x: 0.5, y: 0.5, startTime: 0,
            count: 1, interval: 800,
            freq: 0.02, speed: 15, amp: 20, decay: 0.03
        };

        // Image preloading and upload wiring are handled centrally by maker-engine.js.
        function updateMarkerPosition() {
            marker.style.left = `${config.x * 100}%`;
            marker.style.top = `${config.y * 100}%`;
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            const y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));

            config.x = parseFloat(x.toFixed(3));
            config.y = parseFloat(y.toFixed(3));

            const xInput = document.getElementById('n-x');
            const yInput = document.getElementById('n-y');
            if (xInput) xInput.value = config.x;
            if (yInput) yInput.value = config.y;

            updateMarkerPosition();
            runPreview();
        });

        window.runPreview = runPreview;
        function runPreview() {
            if (cleanupFunc) cleanupFunc();
            updateMarkerPosition();
            cleanupFunc = runRipple(canvas, ctx, {
                ...config,
                imgSrc: window.imgData
            });
        }


        function bind(id, key, isFloat = false) {
            const range = document.getElementById(id);
            const num = document.getElementById('n-' + id);
            if (range) {
                range.addEventListener('input', () => {
                    let val = isFloat ? parseFloat(range.value) : parseInt(range.value);
                    config[key] = val;
                    if (num) num.value = val;
                    runPreview();
                });
            }
            if (num) {
                num.addEventListener('input', () => {
                    let val = isFloat ? parseFloat(num.value) : parseInt(num.value);
                    if (isNaN(val)) return;
                    config[key] = val;
                    if (range) range.value = val;
                    runPreview();
                });
            }
        }

        // Bind all controls
        bind('start', 'startTime');
        bind('interval', 'interval');
        bind('freq', 'freq', true);
        bind('speed', 'speed');
        bind('amp', 'amp');
        bind('decay', 'decay', true);

        // Position inputs manually (since they have no slider)
        bind('x', 'x', true);
        bind('y', 'y', true);

        // Count is special (no slider)
        document.getElementById('count').addEventListener('input', (e) => {
            config.count = parseInt(e.target.value);
        });

        // --- 4. Preview ---
        document.getElementById('previewBtn').addEventListener('click', () => {
            if (cleanupFunc) cleanupFunc();
            cleanupFunc = runRipple(canvas, ctx, { ...config, imgSrc: window.imgData });
        });

        // --- 5. Download ---
        // Rename the download button if running inside the Hub Iframe





        function syncControl(id, value) {
            const range = document.getElementById(id);
            const num = document.getElementById('n-' + id);
            if (range) range.value = value;
            if (num) num.value = value;
        }

        window.MakerAPI = {
            onImageLoaded: () => { if(typeof runPreview === 'function') { runPreview(); } else if(typeof run === 'function') { run(); } },
            run: () => { if(typeof runPreview === 'function') { runPreview(); } else if(typeof run === 'function') { run(); } },
            loadEditConfig: (incomingConfig = {}) => {
                const numericKeys = ['x', 'y', 'startTime', 'count', 'interval', 'freq', 'speed', 'amp', 'decay'];
                numericKeys.forEach((key) => {
                    if (incomingConfig[key] === undefined) return;
                    const nextValue = Number(incomingConfig[key]);
                    if (Number.isNaN(nextValue)) return;
                    config[key] = nextValue;
                });

                syncControl('x', config.x);
                syncControl('y', config.y);
                syncControl('start', config.startTime);
                syncControl('interval', config.interval);
                syncControl('freq', config.freq);
                syncControl('speed', config.speed);
                syncControl('amp', config.amp);
                syncControl('decay', config.decay);

                const countInput = document.getElementById('count');
                if (countInput) countInput.value = config.count;

                updateMarkerPosition();
            },
            getExportJSON: () => {
                const code = `
import { runRipple } from '${ENGINE_PATH}';

export function mount(canvas, ctx, config) { // <-- Allow config to be passed in
    return runRipple(canvas, ctx, {
        ...config, // <-- Merge incoming config (which contains the resize helper)
        imgSrc: 'img/${window.imgName}',
        x: ${config.x.toFixed(3)},
        y: ${config.y.toFixed(3)},
        startTime: ${config.startTime},
        count: ${config.count},
        interval: ${config.interval},
        freq: ${config.freq},
        speed: ${config.speed},
        amp: ${config.amp},
        decay: ${config.decay}
    });
}`;
                // Look aggressively for an object return signature
                const match = code.match(/return\s+\w+\s*\(\s*canvas\s*,\s*ctx\s*,\s*(\{[\s\S]*?\})\s*\)\s*;/);
                let configObj = {};
                if (match) {
                    const objExpr = match[1].replace(/^\s*\.\.\.config\s*,?\s*/m, "");
                    configObj = (new Function("return (" + objExpr + ");"))();
                } else {
                     console.error("Could not parse exported config!");
                }
                return { engine: ENGINE, config: configObj };
            }
        };
    </script>
    <!-- GLOBAL MAKER ENGINE -->
    <script src="studio/maker/maker-engine.js"></script>
</body>
</html>
