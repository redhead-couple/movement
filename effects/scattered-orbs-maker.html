<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <base href="../">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scattered Orbs Maker</title>
    <link rel="stylesheet" href="studio/maker/maker-theme.css">
    <style>
        .control-value {
            float: right;
            color: #93c5fd;
            font-variant-numeric: tabular-nums;
        }

        .origin-help {
            margin: 0 0 9px;
            color: #94a3b8;
            font-size: 0.78rem;
            line-height: 1.45;
        }

        .origin-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .origin-actions button {
            width: auto;
            margin: 0;
        }

        .preview {
            background:
                radial-gradient(circle at 50% 48%, rgba(96, 67, 112, 0.3), transparent 34%),
                linear-gradient(145deg, #13121a, #080b14 64%, #171018);
        }

        .origin-marker {
            position: absolute;
            z-index: 4;
            width: 34px;
            height: 34px;
            margin: -17px 0 0 -17px;
            padding: 0;
            border: 2px solid rgba(255, 255, 255, 0.92);
            border-radius: 50%;
            background: rgba(207, 125, 99, 0.88);
            box-shadow: 0 0 0 6px rgba(207, 125, 99, 0.2), 0 5px 16px rgba(0, 0, 0, 0.38);
            color: white;
            cursor: grab;
            touch-action: none;
        }

        .origin-marker::before,
        .origin-marker::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            background: currentColor;
            transform: translate(-50%, -50%);
        }

        .origin-marker::before {
            width: 12px;
            height: 2px;
        }

        .origin-marker::after {
            width: 2px;
            height: 12px;
        }

        .origin-marker:active {
            cursor: grabbing;
        }

        .preview-note {
            position: absolute;
            right: 18px;
            bottom: 16px;
            padding: 7px 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.78);
            color: #cbd5e1;
            font-size: 0.75rem;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h2 style="margin-top:0">Scattered Orbs</h2>

        <div class="group">
            <button id="runBtn" class="run" type="button">Play from beginning</button>
        </div>

        <div class="group">
            <h4>Timing</h4>
            <label for="startDelay">Start time <span class="control-value" id="val-startDelay">0.5 s</span></label>
            <input type="range" id="startDelay" min="0" max="5" step="0.1" value="0.5">

            <label for="duration">Duration <span class="control-value" id="val-duration">3.6 s</span></label>
            <input type="range" id="duration" min="1" max="8" step="0.1" value="3.6">
        </div>

        <div class="group">
            <h4>Orbs</h4>
            <label for="randomness">Randomness <span class="control-value" id="val-randomness">65%</span></label>
            <input type="range" id="randomness" min="0" max="100" step="5" value="65">

            <label for="size">Size <span class="control-value" id="val-size">32 px</span></label>
            <input type="range" id="size" min="12" max="72" step="1" value="32">

            <label for="count">Amount <span class="control-value" id="val-count">48 orbs</span></label>
            <input type="range" id="count" min="8" max="96" step="1" value="48">
        </div>

        <div class="group">
            <h4>Origin point</h4>
            <p class="origin-help">Click the preview or drag the point to choose where the orbs begin.</p>
            <div class="origin-actions">
                <span class="control-value" id="val-origin">50%, 52%</span>
                <button class="small" id="centerOriginBtn" type="button">Center</button>
            </div>
        </div>

        <div class="group">
            <h4>Export</h4>
            <input type="text" id="filename" value="scattered-orbs.json">
            <button id="downloadBtn" type="button">Download Effect</button>
        </div>
    </div>

    <div class="preview" id="stage">
        <canvas id="cvs"></canvas>
        <button
            class="origin-marker"
            id="originMarker"
            type="button"
            aria-label="Drag to choose the orb origin point"
            title="Orb origin point"
        ></button>
        <div class="preview-note">Bright forms scatter, then reveal their emptiness.</div>
    </div>

    <script type="module">
        import {
            DEFAULTS,
            MAX_ANIMATED_PIXELS,
            MAX_TOTAL_SURFACE_PIXELS,
            SPRITE_ATLAS_PIXELS,
            mount,
            normalizeConfig
        } from '/effects/scattered-orbs-engine.js';

        const ENGINE = 'scattered-orbs';
        const PREVIEW_DEBOUNCE_MS = 140;
        const canvas = document.getElementById('cvs');
        const ctx = canvas.getContext('2d');
        const stage = document.getElementById('stage');
        const marker = document.getElementById('originMarker');
        const cfg = {
            startDelay: DEFAULTS.startDelay,
            duration: DEFAULTS.duration,
            randomness: DEFAULTS.randomness,
            size: DEFAULTS.size,
            count: DEFAULTS.count,
            origin: { ...DEFAULTS.origin }
        };
        const units = {
            startDelay: ' s',
            duration: ' s',
            randomness: '%',
            size: ' px',
            count: ' orbs'
        };
        let controller = null;
        let previewTimer = null;
        let previewRequest = 0;
        let draggingOrigin = false;

        function updateValueLabel(key) {
            const target = document.getElementById('val-' + key);
            if (target) target.textContent = `${cfg[key]}${units[key]}`;
        }

        function updateOriginLabel() {
            document.getElementById('val-origin').textContent =
                `${Math.round(cfg.origin.x * 100)}%, ${Math.round(cfg.origin.y * 100)}%`;
        }

        function updateOriginMarker() {
            const canvasRect = canvas.getBoundingClientRect();
            const stageRect = stage.getBoundingClientRect();
            marker.style.left = `${canvasRect.left - stageRect.left + cfg.origin.x * canvasRect.width}px`;
            marker.style.top = `${canvasRect.top - stageRect.top + cfg.origin.y * canvasRect.height}px`;
            updateOriginLabel();
        }

        function previewConfig() {
            return { ...cfg, origin: { ...cfg.origin }, onResize: updateOriginMarker };
        }

        function restartPreview() {
            previewRequest += 1;
            if (previewTimer !== null) {
                clearTimeout(previewTimer);
                previewTimer = null;
            }
            if (!controller) controller = mount(canvas, ctx, previewConfig());
            else if (typeof controller.restart === 'function') controller.restart(previewConfig());
            updateOriginMarker();
        }

        function schedulePreview() {
            const request = ++previewRequest;
            if (previewTimer !== null) clearTimeout(previewTimer);
            previewTimer = setTimeout(() => {
                previewTimer = null;
                if (request !== previewRequest) return;
                restartPreview();
            }, PREVIEW_DEBOUNCE_MS);
        }

        function setControlValue(key, value) {
            const normalized = normalizeConfig({ ...cfg, [key]: value });
            cfg[key] = normalized[key];
            const input = document.getElementById(key);
            if (input) input.value = String(cfg[key]);
            updateValueLabel(key);
        }

        function setOrigin(x, y, shouldPreview = true) {
            const normalized = normalizeConfig({ ...cfg, origin: { x, y } });
            cfg.origin = normalized.origin;
            updateOriginMarker();
            if (shouldPreview) schedulePreview();
        }

        function originFromPointer(event, shouldPreview) {
            const rect = canvas.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            setOrigin(
                (event.clientX - rect.left) / rect.width,
                (event.clientY - rect.top) / rect.height,
                shouldPreview
            );
        }

        ['startDelay', 'duration', 'randomness', 'size', 'count'].forEach((key) => {
            document.getElementById(key).addEventListener('input', event => {
                setControlValue(key, event.target.value);
                schedulePreview();
            });
        });

        canvas.addEventListener('pointerdown', event => {
            originFromPointer(event, true);
        });
        marker.addEventListener('pointerdown', event => {
            draggingOrigin = true;
            marker.setPointerCapture(event.pointerId);
            event.preventDefault();
        });
        marker.addEventListener('pointermove', event => {
            if (draggingOrigin) originFromPointer(event, false);
        });
        marker.addEventListener('pointerup', event => {
            if (!draggingOrigin) return;
            draggingOrigin = false;
            marker.releasePointerCapture(event.pointerId);
            schedulePreview();
        });
        marker.addEventListener('pointercancel', () => {
            draggingOrigin = false;
            schedulePreview();
        });
        marker.addEventListener('keydown', event => {
            const step = event.shiftKey ? 0.05 : 0.01;
            let x = cfg.origin.x;
            let y = cfg.origin.y;
            if (event.key === 'ArrowLeft') x -= step;
            else if (event.key === 'ArrowRight') x += step;
            else if (event.key === 'ArrowUp') y -= step;
            else if (event.key === 'ArrowDown') y += step;
            else return;
            event.preventDefault();
            setOrigin(x, y, true);
        });

        document.getElementById('centerOriginBtn').addEventListener('click', () => {
            setOrigin(DEFAULTS.origin.x, DEFAULTS.origin.y, true);
        });
        document.getElementById('runBtn').addEventListener('click', restartPreview);
        window.addEventListener('resize', updateOriginMarker);

        function loadEditConfig(config) {
            if (!config || typeof config !== 'object') return;
            const normalized = normalizeConfig(config);
            ['startDelay', 'duration', 'randomness', 'size', 'count'].forEach(key => {
                setControlValue(key, normalized[key]);
            });
            cfg.origin = { ...normalized.origin };
            restartPreview();
        }

        function getExportJSON() {
            return {
                enabled: true,
                name: 'Scattered Orbs',
                engine: ENGINE,
                maker: 'effects/scattered-orbs-maker.html',
                config: {
                    startDelay: cfg.startDelay,
                    duration: cfg.duration,
                    randomness: cfg.randomness,
                    size: cfg.size,
                    count: cfg.count,
                    origin: {
                        x: Number(cfg.origin.x.toFixed(3)),
                        y: Number(cfg.origin.y.toFixed(3))
                    }
                }
            };
        }

        async function runStressCheck() {
            const host = document.createElement('div');
            host.style.cssText =
                'position:fixed;left:0;top:0;width:4px;height:4px;overflow:hidden;opacity:0.01;pointer-events:none;';
            const canvases = [document.createElement('canvas'), document.createElement('canvas')];
            const controllers = [];
            document.body.appendChild(host);

            try {
                canvases.forEach((stressCanvas, index) => {
                    stressCanvas.width = 3840;
                    stressCanvas.height = 2160;
                    stressCanvas.style.width = '1280px';
                    stressCanvas.style.height = '720px';
                    host.appendChild(stressCanvas);
                    controllers.push(mount(stressCanvas, stressCanvas.getContext('2d'), {
                        startDelay: 0,
                        duration: 1,
                        randomness: 100,
                        size: 72,
                        count: 96,
                        origin: index === 0 ? { x: 0.2, y: 0.3 } : { x: 0.8, y: 0.7 }
                    }));
                });

                for (let index = 0; index < 30; index += 1) {
                    const target = controllers[index % controllers.length];
                    target.restart({
                        count: 96,
                        size: 72,
                        randomness: 100,
                        origin: { x: 0.08 + (index % 10) * 0.09, y: 0.15 + (index % 8) * 0.1 }
                    });
                }

                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                await new Promise(resolve => setTimeout(resolve, 450));
                const surfacePixels = canvases.map(item => item.width * item.height);
                const safe = surfacePixels.every(pixels => (
                    pixels <= MAX_ANIMATED_PIXELS
                    && pixels + SPRITE_ATLAS_PIXELS <= MAX_TOTAL_SURFACE_PIXELS
                ));
                if (!safe) throw new Error('Scattered Orbs exceeded its surface budget.');
                return { safe, instances: controllers.length, surfacePixels };
            } finally {
                controllers.forEach(stop => stop());
                host.remove();
            }
        }

        window.MakerAPI = {
            run: restartPreview,
            getExportJSON,
            loadEditConfig,
            runStressCheck
        };
        window.run = restartPreview;

        function disposePreview() {
            previewRequest += 1;
            if (previewTimer !== null) clearTimeout(previewTimer);
            previewTimer = null;
            window.removeEventListener('resize', updateOriginMarker);
            if (controller) controller();
            controller = null;
        }

        window.addEventListener('pagehide', disposePreview, { once: true });
        Object.keys(units).forEach(updateValueLabel);
        restartPreview();
    </script>
    <script src="studio/maker/maker-engine.js"></script>
</body>

</html>
