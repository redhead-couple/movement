<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <base href="../">
    <title>Ghost/Memory Generator</title>
<meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="studio/maker/maker-theme.css">
</head>

<body>

    <div class="sidebar">
        <h2 style="margin-top:0">Ghost Studio</h2>

        <div class="group">
            <h4>1. Import / Image</h4>
            <label>Target Image</label>

            <div style="display: flex; gap: 8px; align-items: center; justify-content: space-between;">
                <input type="file" id="imgInput" accept="image/*" style="width: 150px;">
                <button class="small" onclick="window.openMediaLibrary('img')" style="margin: 0;">Browse Lib</button>
            </div>
            <div id="overrideContainer"></div>

        </div>

        <div class="group">
            <h4>2. Movement</h4>
            <label>Drift Distance X <span id="val-driftX"></span></label>
            <input type="range" id="driftX" min="0" max="200" value="20">

            <label>Drift Distance Y <span id="val-driftY"></span></label>
            <input type="range" id="driftY" min="0" max="200" value="0">

            <label>Pulse (Breathing) <span id="val-scalePulse"></span></label>
            <input type="range" id="scalePulse" min="0" max="0.5" step="0.01" value="0.05">

            <label>Speed <span id="val-speed"></span></label>
            <input type="range" id="speed" min="0.1" max="10" step="0.1" value="2">
        </div>

        <div class="group">
            <h4>3. Style</h4>
            <label>Ghost Opacity <span id="val-opacity"></span></label>
            <input type="range" id="opacity" min="0" max="1" step="0.05" value="0.5">

            <label>Blend Mode</label>
            <select id="blendMode">
                <option value="source-over">Normal</option>
                <option value="screen" selected>Screen (Light/Dreamy)</option>
                <option value="overlay">Overlay (Contrast)</option>
                <option value="multiply">Multiply (Dark/Gloomy)</option>
            </select>

            <div style="margin-top:10px; display:flex; align-items:center;">
                <input type="checkbox" id="mirror">
                <label for="mirror" style="margin:0; width:auto;">Mirror (Reflection)</label>
            </div>
        </div>

        <div class="group">
            <h4>4. Export</h4>
            <input type="text" id="filename" value="ghost-memory.json">
            <button id="downloadBtn">Download Effect</button>
        </div>
    </div>

    <div class="preview" id="stage">
        <canvas id="cvs"></canvas>
    </div>


    <script type="module">
        function effectCodeToDefinition(code, engine) {
            const match = code.match(/return\s+\w+\s*\(\s*canvas\s*,\s*ctx\s*,\s*(\{[\s\S]*?\})\s*\)\s*;/);
            if (!match) throw new Error("Could not parse generated effect code");
            const objExpr = match[1].replace(/^\s*\.\.\.config\s*,?\s*/m, "");
            const config = (new Function("return (" + objExpr + ");"))();
            return { engine, config };
        }

        const ENGINE_PATH = '/effects/ghost-engine.js';
        const ENGINE = 'ghost';
        import { mount } from '/effects/ghost-engine.js';

        const canvas = document.getElementById('cvs');
        const ctx = canvas.getContext('2d');
        let cleanup = null;

        const cfg = {
            driftX: 20, driftY: 0, scalePulse: 0.05, speed: 2,
            opacity: 0.5, blendMode: 'screen', mirror: false
        };

        window.run = run;
        function run() {
            if (cleanup) cleanup();
            Object.keys(cfg).forEach(k => {
                const el = document.getElementById('val-' + k);
                if (el) el.textContent = cfg[k];
            });
            cleanup = mount(canvas, ctx, { ...cfg, imgSrc: window.imgData });
        }

        // Image preloading and upload wiring are handled centrally by maker-engine.js.
        ['driftX', 'driftY', 'scalePulse', 'speed', 'opacity'].forEach((id) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('input', (e) => {
                cfg[id] = parseFloat(e.target.value);
                run();
            });
        });

        document.getElementById('blendMode').addEventListener('change', (e) => {
            cfg.blendMode = e.target.value;
            run();
        });

        document.getElementById('mirror').addEventListener('change', (e) => {
            cfg.mirror = e.target.checked;
            run();
        });

        run();
        window.MakerAPI = {
            onImageLoaded: () => { if(typeof run === 'function') { run(); } else { window.runPreview && window.runPreview(); }},
            run: () => { if(typeof run === 'function') { run(); } else { window.runPreview && window.runPreview(); } },
            getExportJSON: () => {
                const code = `
import { mount as runGhost } from '${ENGINE_PATH}';
export function mount(canvas, ctx, config) {
    return runGhost(canvas, ctx, {
        ...config,
        imgSrc: 'img/${window.imgName}',
        driftX: ${cfg.driftX}, driftY: ${cfg.driftY},
        scalePulse: ${cfg.scalePulse}, speed: ${cfg.speed},
        opacity: ${cfg.opacity}, blendMode: '${cfg.blendMode}',
        mirror: ${cfg.mirror}
    });
}`;
                const match = code.match(/return\s+\w+\s*\(\s*canvas\s*,\s*ctx\s*,\s*(\{[\s\S]*?\})\s*\)\s*;/);
                const objExpr = match[1].replace(/^\s*\.\.\.config\s*,?\s*/m, "");
                const configObj = (new Function("return (" + objExpr + ");"))();
                return { engine: ENGINE, config: configObj };
            }
        };
    </script>
    <!-- GLOBAL MAKER ENGINE -->
    <script src="studio/maker/maker-engine.js"></script>
</body>
</html>
