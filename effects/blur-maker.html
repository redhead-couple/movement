<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <base href="../">
    <title>Blur Maker</title>
<meta name="robots" content="noindex, nofollow">
    <!-- GLOBAL THEME -->
    <link rel="stylesheet" href="studio/maker/maker-theme.css">
</head>

<body>

    <div class="sidebar">
        <h2 style="margin-top:0">Blur Studio</h2>

        <div class="group">
            <h4>1. Image</h4>
            <label>Target Image</label>
            <div style="display: flex; gap: 8px; align-items: center; justify-content: space-between;">
                <input type="file" id="img1Input" accept="image/*" style="width: 150px;">
                <button class="small" onclick="window.openMediaLibrary('img')" style="margin: 0;">Browse Lib</button>
            </div>
            <div id="overrideContainer"></div>
        </div>

        <div class="group">
            <button id="runBtn" class="run">▶ Play Effect</button>
        </div>

        <div class="group">
            <h4>2. Timing</h4>
            <label>Duration (Sec) <span id="val-duration"></span></label>
            <input type="range" id="duration" min="0.5" max="10.0" step="0.5" value="3.0">

            <label>Start Delay (Sec) <span id="val-startDelay"></span></label>
            <input type="range" id="startDelay" min="0" max="5" step="0.1" value="0.0">
        </div>

        <div class="group">
            <h4>3. Style</h4>
            <label>Mode <span id="val-mode"></span></label>
            <select id="modeSelect">
                <option value="in">Blur In (Blurry -> Sharp)</option>
                <option value="out">Blur Out (Sharp -> Blurry)</option>
            </select>

            <label style="margin-top: 15px;">Max Blur Intensity <span id="val-blurIntensity"></span></label>
            <div style="font-size:0.75rem; color:#64748b; margin-bottom:4px;">In Pixels (0px to 50px)</div>
            <input type="range" id="blurIntensity" min="0" max="50" step="1" value="20">
        </div>

        <div class="group">
            <h4>4. Export</h4>
            <input type="text" id="filename" value="blur-effect.json">
            <button id="downloadBtn">Download Effect</button>
        </div>
    </div>

    <div class="preview" id="stage">
        <canvas id="cvs"></canvas>
    </div>

    <!-- MAKER API CONFIGURATION -->
    <script type="module">
        const ENGINE_PATH = '/effects/blur-engine.js';
        const ENGINE = 'blur';
        import { mount } from '/effects/blur-engine.js';

        const canvas = document.getElementById('cvs');
        const ctx = canvas.getContext('2d');
        let cleanup = null;

        const cfg = { duration: 3.0, startDelay: 0.0, blurIntensity: 20, mode: 'in' };

        window.run = function() {
            if (cleanup) cleanup();
            Object.keys(cfg).forEach(k => {
                const el = document.getElementById('val-' + k);
                if (el) el.textContent = cfg[k];
            });
            cleanup = mount(canvas, ctx, {
                ...cfg,
                imgSrc: window.img1Data
            });
        };

        // Bind HTML Inputs to CFG reactively
        Object.keys(cfg).forEach(id => {
            const el = document.getElementById(id === 'mode' ? 'modeSelect' : id);
            if (el) {
                const isNum = typeof cfg[id] === 'number';
                const eventName = el.tagName === 'SELECT' ? 'change' : 'input';
                el.addEventListener(eventName, e => {
                    cfg[id] = isNum ? parseFloat(e.target.value) : e.target.value;
                    if (typeof window.run === 'function') window.run();
                });
            }
        });

        const runBtn = document.getElementById('runBtn');
        if (runBtn) runBtn.addEventListener('click', window.run);

        // Required API for maker-engine.js to interface with this file
        window.MakerAPI = {
            onImageLoaded: () => { window.run(); },
            run: () => { window.run(); },
            loadEditConfig: (c) => {
                if (c.duration !== undefined) { cfg.duration = c.duration; document.getElementById('duration').value = c.duration; }
                if (c.startDelay !== undefined) { cfg.startDelay = c.startDelay; document.getElementById('startDelay').value = c.startDelay; }
                if (c.blurIntensity !== undefined) { cfg.blurIntensity = c.blurIntensity; document.getElementById('blurIntensity').value = c.blurIntensity; }
                if (c.mode !== undefined) { cfg.mode = c.mode; document.getElementById('modeSelect').value = c.mode; }
            },
                        getExportJSON: () => {
                const path1 = window.name1 ? `img/${window.name1}` : '';
                const code = `
import { mount as runBlur } from '${ENGINE_PATH}';
export function mount(canvas, ctx, config) {
    return runBlur(canvas, ctx, {
        ...config,
        imgSrc: '${path1}',
        duration: ${cfg.duration},
        startDelay: ${cfg.startDelay},
        blurIntensity: ${cfg.blurIntensity},
        mode: '${cfg.mode}'
    });
}`;
                // Helper parser
                const match = code.match(/return\s+\w+\s*\(\s*canvas\s*,\s*ctx\s*,\s*(\{[\s\S]*?\})\s*\)\s*;/);
                const objExpr = match[1].replace(/^\s*\.\.\.config\s*,?\s*/m, "");
                const configObj = (new Function("return (" + objExpr + ");"))();
                return { engine: ENGINE, config: configObj };
            }
        };

    </script>

    <!-- GLOBAL MAKER ENGINE -->
    <script src="studio/maker/maker-engine.js"></script>

</body>
</html>
